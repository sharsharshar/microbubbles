<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brane</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }
      canvas { display: block; }
      #info {
        position: absolute;
        bottom: 12px;
        left: 12px;
        color: rgba(255,255,255,0.5);
        font: 12px/1.4 monospace;
        pointer-events: none;
        user-select: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
          "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="info">Brane</div>
    <script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import GUI from "lil-gui";

// ============================================================
// Shaders
// ============================================================

const vertexShader = `
precision highp float;

attribute float aSpeed;
attribute float aIntensity;
attribute float aRandom;
attribute float aFrame;
attribute float aPhase;   // 0..1 along the point's own track, in frame order
attribute float aOffset;  // per-track phase offset so bubbles do not march in step

uniform float u_pointSize;
uniform float u_pixelRatio;
uniform float u_jitter;
uniform float u_time;
uniform float u_speedFilter;
uniform float u_speedBand;
uniform float u_reveal;
uniform float u_edge;
uniform int u_useIntensity;
uniform int u_sizeByIntensity;
uniform float u_maxPixels;
uniform int u_flow;
uniform float u_flowRate;
uniform float u_bubbles;

varying float vSpeed;
varying float vIntensity;
varying float vGlow;
varying float vPulse;

void main() {
  vSpeed = aSpeed;
  vIntensity = aIntensity;
  vGlow = 0.0;

  // Progressive accumulation: only show samples whose (normalised) time has been
  // reached by the reveal front. Past samples persist, so the super-resolution
  // vessel map visibly builds up over the cycle, then resets and replays.
  if (aFrame > u_reveal) {
    gl_PointSize = 0.0;
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    return;
  }

  if (u_speedFilter > 0.0 && abs(aSpeed - u_speedFilter) > u_speedBand) {
    gl_PointSize = 0.0;
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    return;
  }

  // Bright, slightly larger moving front at the leading edge of the reveal.
  vGlow = u_edge > 0.0 ? clamp(1.0 - (u_reveal - aFrame) / u_edge, 0.0, 1.0) : 0.0;

  // Flow: a bright head that slides along the track toward later frames, the
  // direction the bubble was recorded moving. The static points stay as the
  // vessel; the heads are the blood. u_bubbles heads per track.
  vPulse = 0.0;
  if (u_flow == 1) {
    float p = fract(aPhase * u_bubbles - u_time * u_flowRate + aOffset);
    vPulse = smoothstep(0.18, 0.0, p);
  }

  float seed = aRandom * 6.2831;
  vec3 pos = position + u_jitter * vec3(
    sin(seed * 13.7 + u_time * 2.1),
    sin(seed * 17.3 + u_time * 1.7),
    sin(seed * 11.1 + u_time * 2.5)
  );

  vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
  float dist = -mvPosition.z;
  float size = u_pointSize * u_pixelRatio * (300.0 / max(dist, 1.0));
  // Cap in device pixels: zooming in should separate points, not swell them.
  size = min(size, u_maxPixels * u_pixelRatio);

  // Bright detections draw larger: dense vessels fill in as tubes, dim
  // scattered points stay as fine dots. A floor keeps every point visible.
  if (u_sizeByIntensity == 1) {
    size *= 0.55 + 0.7 * aIntensity;
  }
  size *= (1.0 + 1.6 * vGlow);
  size *= (1.0 + 1.4 * vPulse);

  gl_PointSize = size;
  gl_Position = projectionMatrix * mvPosition;
}
`;

const fragmentShader = `
precision highp float;

varying float vSpeed;
varying float vIntensity;
varying float vGlow;

uniform float u_maxSpeed;
uniform int u_colormap;
uniform int u_useIntensity;
uniform float u_opacity;
uniform int u_flow;
uniform float u_tubeDim;
varying float vPulse;

vec3 cmapJet(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t < 0.25) return mix(vec3(0.1, 0.2, 0.8), vec3(0.0, 0.7, 0.9), t / 0.25);
  if (t < 0.5)  return mix(vec3(0.0, 0.7, 0.9), vec3(0.1, 0.9, 0.2), (t - 0.25) / 0.25);
  if (t < 0.75) return mix(vec3(0.1, 0.9, 0.2), vec3(0.95, 0.85, 0.1), (t - 0.5) / 0.25);
  return mix(vec3(0.95, 0.85, 0.1), vec3(0.9, 0.1, 0.1), (t - 0.75) / 0.25);
}

vec3 cmapInferno(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t < 0.33) return mix(vec3(0.0, 0.0, 0.04), vec3(0.55, 0.1, 0.52), t / 0.33);
  if (t < 0.66) return mix(vec3(0.55, 0.1, 0.52), vec3(0.93, 0.47, 0.1), (t - 0.33) / 0.33);
  return mix(vec3(0.93, 0.47, 0.1), vec3(0.99, 0.96, 0.64), (t - 0.66) / 0.34);
}

vec3 cmapViridis(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t < 0.33) return mix(vec3(0.27, 0.0, 0.33), vec3(0.17, 0.32, 0.54), t / 0.33);
  if (t < 0.66) return mix(vec3(0.17, 0.32, 0.54), vec3(0.13, 0.66, 0.47), (t - 0.33) / 0.33);
  return mix(vec3(0.13, 0.66, 0.47), vec3(0.99, 0.91, 0.14), (t - 0.66) / 0.34);
}

vec3 cmapPlasma(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t < 0.33) return mix(vec3(0.25, 0.30, 0.95), vec3(0.70, 0.15, 0.75), t / 0.33);
  if (t < 0.66) return mix(vec3(0.70, 0.15, 0.75), vec3(0.98, 0.50, 0.15), (t - 0.33) / 0.33);
  return mix(vec3(0.98, 0.50, 0.15), vec3(1.0, 0.78, 0.40), (t - 0.66) / 0.34);
}

vec3 cmapCoolwarm(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t < 0.5) return mix(vec3(0.23, 0.30, 0.75), vec3(0.87, 0.87, 0.87), t / 0.5);
  return mix(vec3(0.87, 0.87, 0.87), vec3(0.71, 0.02, 0.15), (t - 0.5) / 0.5);
}

vec3 cmapHot(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t < 0.33) return mix(vec3(0.0, 0.0, 0.0), vec3(0.9, 0.0, 0.0), t / 0.33);
  if (t < 0.66) return mix(vec3(0.9, 0.0, 0.0), vec3(1.0, 0.9, 0.0), (t - 0.33) / 0.33);
  return mix(vec3(1.0, 0.9, 0.0), vec3(1.0, 1.0, 1.0), (t - 0.66) / 0.34);
}

vec3 cmapTurbo(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t < 0.2)  return mix(vec3(0.19, 0.07, 0.23), vec3(0.16, 0.34, 0.85), t / 0.2);
  if (t < 0.4)  return mix(vec3(0.16, 0.34, 0.85), vec3(0.06, 0.72, 0.65), (t - 0.2) / 0.2);
  if (t < 0.6)  return mix(vec3(0.06, 0.72, 0.65), vec3(0.44, 0.88, 0.12), (t - 0.4) / 0.2);
  if (t < 0.8)  return mix(vec3(0.44, 0.88, 0.12), vec3(0.95, 0.65, 0.04), (t - 0.6) / 0.2);
  return mix(vec3(0.95, 0.65, 0.04), vec3(0.76, 0.15, 0.11), (t - 0.8) / 0.2);
}

vec3 applyColormap(float t) {
  if (u_colormap == 1) return cmapInferno(t);
  if (u_colormap == 2) return cmapViridis(t);
  if (u_colormap == 3) return cmapPlasma(t);
  if (u_colormap == 4) return cmapCoolwarm(t);
  if (u_colormap == 5) return cmapHot(t);
  if (u_colormap == 6) return cmapTurbo(t);
  return cmapJet(t);
}

void main() {
  vec2 cxy = 2.0 * gl_PointCoord - 1.0;
  float r2 = dot(cxy, cxy);
  if (r2 > 1.0) discard;

  float t;
  if (u_useIntensity == 1) {
    t = vIntensity;
  } else {
    t = vSpeed / max(u_maxSpeed, 0.001);
  }
  vec3 color = applyColormap(t);
  color = mix(color, vec3(1.0), 0.35 * vGlow);
  if (u_flow == 1) {
    color *= mix(u_tubeDim, 1.0, vPulse);
    color = mix(color, vec3(1.0), 0.25 * vPulse);
  }
  // Soft-edged disc: overlapping points along a vessel blend into a tube
  // instead of a chain of hard circles.
  float alpha = u_opacity * smoothstep(1.0, 0.25, r2);
  gl_FragColor = vec4(color * alpha, alpha);
}
`;

// ============================================================
// TrackLoader
// ============================================================

const MAGIC = 0x554c4d54;

async function loadTracks(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`Failed to load ${url}: ${response.status}`);
  const buffer = await response.arrayBuffer();

  const headerView = new DataView(buffer, 0, 64);
  const magic = headerView.getUint32(0, true);
  if (magic !== MAGIC) throw new Error(`Bad magic: 0x${magic.toString(16)}`);

  const version = headerView.getUint32(4, true);
  if (version !== 2 && version !== 3) throw new Error(`Unsupported version: ${version}`);

  const floatsPerPoint = version >= 3 ? 6 : 5;
  const nTracks = headerView.getUint32(8, true);
  const totalPoints = headerView.getUint32(12, true);
  const maxSpeed = headerView.getFloat32(16, true);

  const boundsMin = [
    headerView.getFloat32(20, true),
    headerView.getFloat32(24, true),
    headerView.getFloat32(28, true),
  ];
  const boundsMax = [
    headerView.getFloat32(32, true),
    headerView.getFloat32(36, true),
    headerView.getFloat32(40, true),
  ];

  const tableOffset = 64;
  const tableView = new DataView(buffer, tableOffset, nTracks * 8);
  const tracks = new Array(nTracks);
  for (let i = 0; i < nTracks; i++) {
    tracks[i] = {
      pointOffset: tableView.getUint32(i * 8, true),
      length: tableView.getUint32(i * 8 + 4, true),
    };
  }

  const pointDataOffset = tableOffset + nTracks * 8;
  const pointData = new Float32Array(buffer, pointDataOffset, totalPoints * floatsPerPoint);

  return { nTracks, totalPoints, maxSpeed, boundsMin, boundsMax, tracks, pointData, floatsPerPoint };
}

// ============================================================
// TrackSystem
// ============================================================

class TrackSystem {
  constructor(trackData) {
    this.trackData = trackData;
    const { nTracks, tracks, totalPoints, pointData } = trackData;
    const fpp = trackData.floatsPerPoint || 5;
    this.floatsPerPoint = fpp;
    const hasIntensity = fpp >= 6;

    // Global time range across all samples. Frames are global across
    // acquisitions, so the reveal sweeps the recording in chronological order.
    let minFrame = Infinity;
    let maxFrame = -Infinity;
    for (let i = 0; i < nTracks; i++) {
      const off = tracks[i].pointOffset * fpp;
      const len = tracks[i].length;
      const f0 = pointData[off + 3];
      const f1 = pointData[off + (len - 1) * fpp + 3];
      if (f0 < minFrame) minFrame = f0;
      if (f1 > maxFrame) maxFrame = f1;
    }
    const span = Math.max(maxFrame - minFrame, 1);

    // One persistent vertex per track sample (no per-frame interpolation).
    const positions = new Float32Array(totalPoints * 3);
    const speeds = new Float32Array(totalPoints);
    const intensities = new Float32Array(totalPoints);
    const randoms = new Float32Array(totalPoints);
    const frames = new Float32Array(totalPoints);
    const phases = new Float32Array(totalPoints);
    const offsets = new Float32Array(totalPoints);

    let k = 0;
    for (let i = 0; i < nTracks; i++) {
      const off = tracks[i].pointOffset * fpp;
      const len = tracks[i].length;
      const trackOffset = Math.random();
      for (let j = 0; j < len; j++) {
        const b = off + j * fpp;
        phases[k] = len > 1 ? j / (len - 1) : 0.0;
        offsets[k] = trackOffset;
        positions[k * 3] = pointData[b];
        positions[k * 3 + 1] = pointData[b + 1];
        positions[k * 3 + 2] = pointData[b + 2];
        speeds[k] = pointData[b + 4];
        intensities[k] = hasIntensity ? pointData[b + 5] : 1.0;
        randoms[k] = Math.random();
        frames[k] = (pointData[b + 3] - minFrame) / span;
        k++;
      }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("aSpeed", new THREE.BufferAttribute(speeds, 1));
    geometry.setAttribute("aIntensity", new THREE.BufferAttribute(intensities, 1));
    geometry.setAttribute("aRandom", new THREE.BufferAttribute(randoms, 1));
    geometry.setAttribute("aFrame", new THREE.BufferAttribute(frames, 1));
    geometry.setAttribute("aPhase", new THREE.BufferAttribute(phases, 1));
    geometry.setAttribute("aOffset", new THREE.BufferAttribute(offsets, 1));

    this.uniforms = {
      u_pointSize: { value: 0.3 },
      u_pixelRatio: { value: window.devicePixelRatio },
      u_maxSpeed: { value: trackData.maxSpeed * 0.5 },
      u_colormap: { value: 0 },
      u_jitter: { value: 0.0 },
      u_time: { value: 0.0 },
      u_speedFilter: { value: -1.0 },
      u_speedBand: { value: 0.08 },
      u_useIntensity: { value: 0 },
      u_sizeByIntensity: { value: 1 },
      u_maxPixels: { value: 6.0 },
      u_flow: { value: 1 },
      u_flowRate: { value: 0.5 },
      u_bubbles: { value: 2.0 },
      u_tubeDim: { value: 0.55 },
      u_opacity: { value: 1.0 },
      u_reveal: { value: 0.0 },
      u_edge: { value: 0.04 },
    };

    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms: this.uniforms,
      transparent: true,
      depthWrite: false,
      // Premultiplied alpha: the shader already scales colour by alpha.
      blending: THREE.CustomBlending,
      blendSrc: THREE.OneFactor,
      blendDst: THREE.OneMinusSrcAlphaFactor,
    });

    this.points = new THREE.Points(geometry, material);

    // Reveal sweeps 0 -> 1 (build-up), holds the full map, then restarts.
    this.reveal = 0.0;
    this.holdFraction = 0.18;
  }

  getObject3D() {
    return this.points;
  }

  update(dt, speedMultiplier, buildUp, opacity) {
    this.uniforms.u_time.value += dt;
    if (!buildUp) {
      // Whole map at once, fading in over ~2 s from the moment build-up is off.
      this.fade = Math.min((this.fade ?? 0) + dt / 2.0, 1.0);
      this.uniforms.u_reveal.value = 1.0;
      this.uniforms.u_edge.value = 0.0;
      this.uniforms.u_opacity.value = opacity * this.fade;
      return;
    }
    this.fade = 0.0;
    this.uniforms.u_edge.value = 0.04;
    this.uniforms.u_opacity.value = opacity;
    // speedMultiplier ("frames/s") drives how fast the map builds; 240 ~= 1 s.
    const rate = Math.max(speedMultiplier, 1.0) / 240.0;
    this.reveal += dt * rate;
    const cycle = 1.0 + this.holdFraction;
    if (this.reveal > cycle) this.reveal -= cycle;
    this.uniforms.u_reveal.value = Math.min(this.reveal, 1.0);
  }

  setRenderParams({ pointSize, maxSpeed, colormap, jitter, speedFilter, maxSpeedData, useIntensity, sizeByIntensity, maxPixels, flow, flowRate, bubbles, tubeDim }) {
    if (flow !== undefined) this.uniforms.u_flow.value = flow ? 1 : 0;
    if (flowRate !== undefined) this.uniforms.u_flowRate.value = flowRate;
    if (bubbles !== undefined) this.uniforms.u_bubbles.value = bubbles;
    if (tubeDim !== undefined) this.uniforms.u_tubeDim.value = tubeDim;
    if (sizeByIntensity !== undefined) this.uniforms.u_sizeByIntensity.value = sizeByIntensity ? 1 : 0;
    if (maxPixels !== undefined) this.uniforms.u_maxPixels.value = maxPixels;
    if (pointSize !== undefined) this.uniforms.u_pointSize.value = pointSize;
    if (maxSpeed !== undefined) this.uniforms.u_maxSpeed.value = maxSpeed;
    if (colormap !== undefined) this.uniforms.u_colormap.value = colormap;
    if (jitter !== undefined) this.uniforms.u_jitter.value = jitter;
    if (speedFilter !== undefined) this.uniforms.u_speedFilter.value = speedFilter;
    if (maxSpeedData !== undefined) this.uniforms.u_speedBand.value = maxSpeedData * 0.02;
    if (useIntensity !== undefined) this.uniforms.u_useIntensity.value = useIntensity ? 1 : 0;
  }
}

// ============================================================
// App
// ============================================================

const COLORMAPS = { Jet: 0, Inferno: 1, Viridis: 2, Plasma: 3, Coolwarm: 4, Hot: 5, Turbo: 6 };

const params = {
  buildUp: false,    // show the whole map at once; true replays the acquisition
  speedMultiplier: 60.0,
  pointSize: 0.45,
  maxPixels: 6,
  bloom: 0.25,
  maxSpeed: 0.1713,  // mm per frame; 38 mm/s at 222 Hz, the top of the colour scale
  colormap: 6,       // Turbo: ordered blue -> red, bright across the whole range
  opacity: 1.0,
  jitter: 0.0,
  speedFilter: 0.0,
  particlesPerTrack: 40,
  colorBy: "speed",
  sizeByIntensity: true,
  flow: true,        // bubbles sliding along each vessel in the recorded direction
  flowRate: 0.5,     // track lengths per second
  bubbles: 2,        // heads per track
  tubeDim: 0.55,     // brightness of the static vessel under the moving heads
  paused: false,
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0x010104);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.up.set(0, 0, 1);
camera.position.set(15, 10, 30);

const orbitControls = new OrbitControls(camera, renderer.domElement);
orbitControls.enableDamping = true;
orbitControls.dampingFactor = 0.05;
orbitControls.target.set(0, 0, 15);
orbitControls.update();

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// Bloom gives dense vessels the glow of Aleph's renders; threshold low so dim
// slow-flow points still contribute a halo.
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.25, 0.3, 0.7
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

const info = document.getElementById("info");
info.textContent = "Loading tracks...";

let trackSystem = null;
let trackData = null;

function applyParams() {
  if (!trackSystem) return;
  trackSystem.setRenderParams({
    pointSize: params.pointSize,
    maxSpeed: params.maxSpeed,
    colormap: params.colormap,
    jitter: params.jitter,
    speedFilter: params.speedFilter,
    maxSpeedData: trackData ? trackData.maxSpeed : 1.0,
    useIntensity: params.colorBy === "intensity",
    sizeByIntensity: params.sizeByIntensity,
    maxPixels: params.maxPixels,
    flow: params.flow,
    flowRate: params.flowRate,
    bubbles: params.bubbles,
    tubeDim: params.tubeDim,
  });
}

async function init() {
  try {
    trackData = await loadTracks("data/tracks.bin");
    info.textContent = `Loaded ${trackData.nTracks.toLocaleString()} tracks (${trackData.totalPoints.toLocaleString()} points)`;

    trackSystem = new TrackSystem(trackData);
    scene.add(trackSystem.getObject3D());

    const bmin = new THREE.Vector3(...trackData.boundsMin);
    const bmax = new THREE.Vector3(...trackData.boundsMax);
    const size = bmax.clone().sub(bmin);
    const center = bmin.clone().add(size.clone().multiplyScalar(0.5));

    const boxGeo = new THREE.BoxGeometry(size.x, size.y, size.z);
    const boxEdges = new THREE.EdgesGeometry(boxGeo);
    const boxLine = new THREE.LineSegments(
      boxEdges,
      new THREE.LineBasicMaterial({ color: 0x333355, linewidth: 1 })
    );
    boxLine.position.copy(center);
    scene.add(boxLine);

    orbitControls.target.copy(center);
    camera.position.set(
      center.x,
      center.y + Math.max(size.x, size.z) * 0.75,
      center.z
    );
    orbitControls.update();

    const gui = new GUI({ title: "Brane" });
    const flow = gui.addFolder("Flow");
    flow.add(params, "flow").name("Bubbles along vessels").onChange(applyParams);
    flow.add(params, "flowRate", 0.05, 3).name("Flow rate (tracks/s)").onChange(applyParams);
    flow.add(params, "bubbles", 1, 6, 1).name("Bubbles per track").onChange(applyParams);
    flow.add(params, "tubeDim", 0.0, 1.0).name("Vessel brightness").onChange(applyParams);
    gui.add(params, "buildUp").name("Build up over time");
    gui.add(params, "speedMultiplier", 1, 240).name("Build speed (frames/s)");
    gui.add(params, "colorBy", ["speed", "intensity"]).name("Color by").onChange(applyParams);
    gui.add(params, "colormap", COLORMAPS).name("Colormap").onChange(applyParams);
    gui.add(params, "maxSpeed", 0.02, 0.5).name("Speed scale top (mm/frame)").onChange(applyParams);
    gui.add(params, "pointSize", 0.05, 1.5).name("Point size").onChange(applyParams);
    gui.add(params, "maxPixels", 1, 20).name("Max point px").onChange(applyParams);
    gui.add(params, "sizeByIntensity").name("Size by intensity").onChange(applyParams);
    gui.add(params, "opacity", 0.05, 1.0).name("Opacity");
    gui.add(params, "bloom", 0.0, 2.5).name("Bloom").onChange((v) => { bloomPass.strength = v; });
    const maxSpd = trackData.maxSpeed;
    gui.add(params, "speedFilter", 0, maxSpd).name("Speed filter").onChange(applyParams);

    applyParams();
    info.textContent = `${trackData.nTracks.toLocaleString()} tracks | drag to orbit`;
  } catch (err) {
    console.error(err);
    info.textContent = `Error: ${err.message}`;
  }
}

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  orbitControls.update();
  if (trackSystem && !params.paused) {
    trackSystem.update(dt, params.speedMultiplier, params.buildUp, params.opacity);
  }
  composer.render();
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

init();
animate();
    </script>
  </body>
</html>
